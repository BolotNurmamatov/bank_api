version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: api_bank_backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: api_bank_frontend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: api_bank_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
