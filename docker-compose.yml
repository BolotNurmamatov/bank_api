version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: treasury_db
    environment:
      POSTGRES_USER: treasury_user
      POSTGRES_PASSWORD: treasury_password
      POSTGRES_DB: treasury_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
