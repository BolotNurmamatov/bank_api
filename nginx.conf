worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Optional: Log formats
    # access_log  logs/access.log;
    # error_log   logs/error.log;

    server {
    listen 80;
    server_name redfin.redpetroleum.kg;

    return 301 https://$host$request_uri;
    }

    # HTTP Server - Routes traffic using IP address without SSL
    server {
        listen 443 ssl;
        server_name  redfin.redpetroleum.kg; # Accepts any IP or hostname

        ssl_certificate     C:\Users\Administrator\Downloads\STAR_redpetroleum_kg\Nginx\STAR_redpetroleum_kg.crt;
        ssl_certificate_key C:\Users\Administrator\Downloads\STAR_redpetroleum_kg\privatekey.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Route all other traffic to the Next.js frontend
        location / {
            proxy_pass http://127.0.0.1:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Next.js specific proxy headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
